name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: profiterol
          POSTGRES_PASSWORD: profiterol
          POSTGRES_DB: profiterol
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U profiterol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://profiterol:profiterol@localhost:5432/profiterol
      JWT_SECRET: ci-secret
      # The browser tests run with the page cache on, so every change must clear it.
      CACHE_PURGE_TOKEN: ci-purge-token
      NUXT_CACHE_PURGE_TOKEN: ci-purge-token
      # The domains agent's routes (the site tests play the agent).
      INTERNAL_TOKEN: ci-agent-token
      UPLOAD_DIR: /tmp/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Blocks package
        run: |
          npm run build -w @profiterol/blocks
          npm test -w @profiterol/blocks

      - name: API typecheck and build
        run: |
          npm run typecheck -w @profiterol/api
          npm run build -w @profiterol/api

      - name: API end-to-end tests (runs migrations and the first-start seed)
        working-directory: apps/api
        run: |
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/api/health && break; sleep 1; done
          npm run test:e2e
      - name: API log
        if: failure()
        run: cat /tmp/api.log

      - name: Check the migrations match the entities
        working-directory: apps/api
        run: |
          npx typeorm migration:generate -d dist/data-source.js /tmp/Drift --check

      - name: Web build
        run: npm run build -w @profiterol/web

      - name: Lint and formatting
        run: |
          npx eslint .
          npx prettier --check .

      - name: Browser tests (site, editor, admin)
        run: |
          sudo apt-get update -q > /dev/null && sudo apt-get install -y --no-install-recommends ffmpeg > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          (cd apps/web && PORT=3000 NUXT_API_INTERNAL=http://localhost:3001/api node .output/server/index.mjs > /tmp/web.log 2>&1 &)
          node e2e/proxy.mjs > /tmp/proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/admin/login && break; sleep 1; done
          npm run e2e
      - name: Web and API logs
        if: failure()
        run: tail -n 200 /tmp/web.log /tmp/api.log
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/.output/
          retention-days: 7

  deploy-files:
    name: Production files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh docker/backup/entrypoint.sh docker/nginx/prod/40-reload-certificates.sh docker/domains/agent.sh
      - name: Production compose file is valid
        run: |
          cp .env.production.example .env
          docker compose -f docker-compose.prod.yml config --quiet
          docker network create oblivion
          docker compose -f docker-compose.prod.yml -f docker-compose.oblivion.yml config --quiet
      - name: Production nginx config is valid
        run: |
          mkdir -p /tmp/le/live/example.com
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=example.com \
            -keyout /tmp/le/live/example.com/privkey.pem -out /tmp/le/live/example.com/fullchain.pem
          docker run --rm -e DOMAIN=example.com -e EXTRA_DOMAINS=www.example.com \
            -v "$PWD/docker/nginx/prod/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/docker/nginx/prod/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            -v "$PWD/docker/nginx/prod/proxy.conf:/etc/nginx/snippets/proxy.conf:ro" \
            -v /tmp/le:/etc/letsencrypt:ro \
            nginx:1.27-alpine /docker-entrypoint.sh nginx -t
      - name: Oblivion nginx config is valid
        run: |
          docker run --rm -e DOMAIN=example.com \
            -v "$PWD/docker/nginx/oblivion/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/docker/nginx/prod/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            -v "$PWD/docker/nginx/oblivion/proxy.conf:/etc/nginx/snippets/oblivion-proxy.conf:ro" \
            nginx:1.27-alpine /docker-entrypoint.sh nginx -t
      - name: Sites config written by the domains agent is valid
        run: |
          sudo apt-get install -y --no-install-recommends jq > /dev/null
          for d in a.test c.test; do
            mkdir -p /tmp/le/live/$d
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=$d \
              -keyout /tmp/le/live/$d/privkey.pem -out /tmp/le/live/$d/fullchain.pem
          done
          mkdir -p /tmp/ob/snippets /tmp/ob/conf.d
          echo 'location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }' > /tmp/ob/snippets/acme.conf
          printf 'proxy_set_header Host $host;\nproxy_set_header X-Forwarded-Proto $scheme;\n' > /tmp/ob/snippets/proxy.conf
          echo 'resolver 127.0.0.11 valid=10s;' > /tmp/ob/conf.d/00-http.conf
          echo '[{"id":"1","name":"A","primary":"a.test","domains":["a.test","www.a.test"],"sslMode":"requested"},
                 {"id":"2","name":"B","primary":"b.test","domains":["b.test","www.b.test"],"sslMode":"off"},
                 {"id":"3","name":"C","primary":"c.test","domains":["c.test"],"sslMode":"requested"},
                 {"id":"4","name":"D","primary":"d.test","domains":["d.test"],"sslMode":"requested"}]' |
            CERTS_DIR=/tmp/le/live CERTS_PATH=/etc/letsencrypt/live ELSEWHERE=d.test \
              sh docker/domains/agent.sh render > /tmp/ob/conf.d/profiterol-sites.conf
          grep -q 'server_name c.test;' /tmp/ob/conf.d/profiterol-sites.conf
          ! grep -q 'd.test;' /tmp/ob/conf.d/profiterol-sites.conf
          cat /tmp/ob/conf.d/profiterol-sites.conf
          docker run --rm -v /tmp/ob/conf.d:/etc/nginx/conf.d:ro -v /tmp/ob/snippets:/etc/nginx/snippets:ro \
            -v /tmp/le:/etc/letsencrypt:ro nginx:1.27-alpine nginx -t
      - name: Backup and domains agent images build
        run: |
          docker build -f docker/backup/Dockerfile .
          docker build -f docker/domains/Dockerfile .

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
