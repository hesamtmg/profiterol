# Browsers that accept AVIF get the AVIF copy of a photo when one has been made (see the WebP location below).
map $http_accept $avif {
  default "";
  "~*image/avif" ".avif";
}

upstream api {
  server api:3001;
}

upstream web {
  server web:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;
  server_tokens off;

  # The API (helmet) and the web app (server/plugins/security-headers.ts) send their own security headers.

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;

  # Sized copies of photos: answered with the smaller AVIF copy when the browser accepts it and it exists.
  location ~ "^/uploads/(?<copy>[\w-]+-\d+)\.webp$" {
    root /data;
    types { image/webp webp; image/avif avif; }
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Vary Accept;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'" always;
    try_files /uploads/$copy$avif /uploads/$copy.webp =404;
  }

  # Uploaded files are served straight from the shared volume.
  location /uploads/ {
    alias /data/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'" always;
    try_files $uri =404;
  }

  # The API clears the web app's page cache directly, not through here.
  location /_cache/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Nuxt's hashed build assets never change, so cache them for a long time.
  location /_nuxt/ {
    proxy_pass http://web;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
