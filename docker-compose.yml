name: profiterol

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-profiterol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profiterol}
      POSTGRES_DB: ${POSTGRES_DB:-profiterol}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-profiterol}:${POSTGRES_PASSWORD:-profiterol}@db:5432/${POSTGRES_DB:-profiterol}
      # Migrations run automatically on start. DB_SYNC=true skips them and builds tables from the entities (local experiments only).
      DB_SYNC: ${DB_SYNC:-false}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      UPLOAD_DIR: /data/uploads
      # Optional: email form messages (e.g. smtps://user:pass@smtp.example.com:465)
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SITE_URL: ${SITE_URL:-}
      # Clears the web app's page cache after changes; the same secret is given to the web app below.
      WEB_INTERNAL_URL: http://web:3000
      CACHE_PURGE_TOKEN: ${CACHE_PURGE_TOKEN:-${JWT_SECRET}}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NUXT_API_INTERNAL: http://api:3001/api
      NUXT_CACHE_PURGE_TOKEN: ${CACHE_PURGE_TOKEN:-${JWT_SECRET}}
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/data/uploads:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
  uploads:
