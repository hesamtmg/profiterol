# Production stack: HTTPS with Let's Encrypt, health checks, nightly backups and log rotation.
# Setup and day-to-day commands are in DEPLOY.md. Settings come from .env (see .env.production.example).
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Images are pulled from GitHub Container Registry (built by .github/workflows/deploy.yml).
# Without registry access, build them on the server instead: ./scripts/deploy.sh --build

name: profiterol

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-profiterol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-profiterol}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    image: ${API_IMAGE:-ghcr.io/hesamtmg/profiterol-api}:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-profiterol}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-profiterol}
      DB_SYNC: 'false'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (e.g. openssl rand -hex 32)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      UPLOAD_DIR: /data/uploads
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Used in emailed links (password resets, invitations).
      SITE_URL: https://${DOMAIN}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/hesamtmg/profiterol-web}:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NUXT_API_INTERNAL: http://api:3001/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. example.com}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-}
    volumes:
      - ./docker/nginx/prod/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/prod/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./docker/nginx/prod/proxy.conf:/etc/nginx/snippets/proxy.conf:ro
      - ./docker/nginx/prod/40-reload-certificates.sh:/docker-entrypoint.d/40-reload-certificates.sh:ro
      - ./docker/nginx/prod/unavailable.html:/usr/share/nginx/errors/_unavailable.html:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - uploads:/data/uploads:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *logging

  # Renews certificates twice a day when they are close to expiry; nginx reloads every 6 hours.
  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    logging: *logging

  # Nightly database + uploads backups into ./backups (see scripts/backup.sh).
  backup:
    image: profiterol-backup:local
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-profiterol}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-profiterol}
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-UTC}
    volumes:
      - ./backups:/backups
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  uploads:
